# The credential the RUNNING SERVICE holds. Distinct from db-migrator in the one
# way that matters: this role has no DDL rights and no DELETE anywhere. V3 grants
# it SELECT and INSERT on the append-only tables, UPDATE only where a balance, a
# hold or a wallet moves, and nothing at all on flyway_schema_history.
#
# Consumed by k8s/deployment.yaml. The same OpenBao path is read a second time in
# the `postgres` namespace (gitops) so CloudNativePG sets the ledger_app role's
# password to this value: one value, two readers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-wallet-ledger
  target:
    name: db-app
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_USERNAME: ledger_app
        DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: wallet-ledger/db-app
        property: password
