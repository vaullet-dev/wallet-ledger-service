# Flyway, as a Job, holding the migrator role. Not the service: in a deployed
# environment application-prod.yaml sets spring.flyway.enabled=false, so the
# running service never has DDL rights and never sees this credential.
#
# It is also what writes ledger_config. The Job starts the whole application
# context without a web server (application-migrate.yaml), so
# LedgerConfigProvisioner runs here, as ledger_migrator: it records
# LEDGER_CURRENCY on the first run and fails every later run configured for
# another currency. The service only reads the row; V3 gives it nothing more.
#
# An Argo SYNC HOOK rather than a plain Job. A Job's spec is immutable, so a
# plain Job cannot be updated when the image tag changes -- Argo would try, the
# API would refuse, and the sync would fail on every release. BeforeHookCreation
# deletes the previous Job and creates a new one each sync, which is what "run
# the migrations for this version" actually means.
#
# Sync wave 0, and the Deployment is wave 1: Argo applies the Deployment only
# after this Job has succeeded. A failed migration, or a currency mismatch, fails
# the sync and leaves the running version exactly as it was.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  # A migration that hangs holds an advisory lock. Fail loudly instead.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      # The ledger never calls the Kubernetes API, so the pod gets no token to
      # call it with.
      automountServiceAccountToken: false
      volumes:
        # The image is a Paketo buildpack build (spring-boot:build-image), not the
        # Dockerfile in this repo -- that file is for local use only. The JVM needs
        # a writable /tmp, so readOnlyRootFilesystem below requires this.
        - name: tmp
          emptyDir: {}
      containers:
        - name: migrate
          # Rewritten by kustomize from the images: block in kustomization.yaml.
          # ADR-010 §4: never a mutable tag.
          image: ghcr.io/vaullet-dev/ledger-service
          imagePullPolicy: IfNotPresent
          env:
            # Order matters: later wins, so `migrate` beats prod's
            # flyway.enabled=false. Reversed, this Job starts, migrates nothing
            # and exits 0 -- a silent no-op that looks like success.
            - name: SPRING_PROFILES_ACTIVE
              value: prod,migrate
            # Paketo sizes the heap from the container limit by SUBTRACTING a fixed
            # 240M code cache, ~100M metaspace and thread_count x 1M of stacks. Its
            # default of 250 threads is sized for a web application; this Job serves
            # nothing, and at 250 the arithmetic leaves so little heap that the
            # calculator fails outright rather than starting small.
            - name: BPL_JVM_THREAD_COUNT
              value: "50"
            - name: APP_ENVIRONMENT
              value: prod
            # money-rw always points at the current primary of the `money`
            # CloudNativePG cluster, where ADR-003 puts vaullet_db. No currentSchema,
            # unlike auth-service: the database is the ledger's alone, and V1 put its
            # tables in public.
            - name: DB_URL
              value: jdbc:postgresql://money-rw.postgres.svc:5432/vaullet_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-migrator, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-migrator, key: DB_PASSWORD } }
            # From the ConfigMap kustomization.yaml generates, the same one the
            # Deployment reads.
            - name: LEDGER_CURRENCY
              valueFrom: { configMapKeyRef: { name: ledger-config, key: LEDGER_CURRENCY } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            # 1Gi, not less: see BPL_JVM_THREAD_COUNT above. Below roughly 600Mi the
            # Paketo memory calculator refuses to produce a configuration at all.
            limits:   { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      securityContext:
        runAsNonRoot: true          # the image's own user; no UID hardcoded here
        seccompProfile: { type: RuntimeDefault }
