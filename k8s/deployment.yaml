# The running service. Holds ledger_app, which V3 granted SELECT and INSERT on
# the append-only tables, UPDATE only where a balance, a hold or a wallet moves,
# and nothing else -- no DDL, no DELETE, no TRUNCATE. The migration Job holds a
# different role; neither process can do the other's job.
#
# Sync wave 1, after the migration Job (a Sync hook in wave 0). Argo applies this
# only once the Job has succeeded, so a new version never starts in front of a
# schema it was not built for. The first start depends on it as well: the Job is
# what writes ledger_config, and this role cannot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  labels: { app: ledger-service }
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: ledger-service }
  template:
    metadata:
      labels: { app: ledger-service }
    spec:
      # The ledger never calls the Kubernetes API, so the pod gets no token to
      # call it with.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        # The published image is a Paketo buildpack build, and the JVM needs a
        # writable /tmp -- without this, readOnlyRootFilesystem below stops it
        # starting.
        - name: tmp
          emptyDir: {}
      containers:
        - name: ledger-service
          image: ghcr.io/vaullet-dev/ledger-service
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: APP_ENVIRONMENT,        value: prod }

            # Paketo derives the heap by SUBTRACTING a fixed code cache, metaspace
            # and thread_count x 1M from the container limit. 200 matches
            # server.tomcat.threads.max in application-prod.yaml, so the accounting
            # reflects what actually runs.
            - { name: BPL_JVM_THREAD_COUNT,   value: "200" }

            # money-rw always points at the current primary. vaullet_db is the
            # ledger's own database (ADR-003), its tables are in public, and so
            # there is no currentSchema to pin.
            - name: DB_URL
              value: jdbc:postgresql://money-rw.postgres.svc:5432/vaullet_db
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: db-app, key: DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-app, key: DB_PASSWORD } }

            # No default in application.yaml, deliberately: unset means no
            # JwtDecoder and the context refuses to start rather than serving
            # unauthenticated. Must equal Keycloak's issuer character for
            # character -- it is compared against every token's `iss`.
            - name: OAUTH2_ISSUER_URI
              value: https://vaullet.dev/auth/realms/vaullet

            # Checked against ledger_config at every start, never written from
            # here. The ConfigMap's name carries a hash of its content, so changing
            # the currency changes this pod spec too, and the migration Job fails
            # the sync on the mismatch before a single pod rolls.
            - name: LEDGER_CURRENCY
              valueFrom: { configMapKeyRef: { name: ledger-config, key: LEDGER_CURRENCY } }

          # The platform defaults' probe groups are the availability states and
          # nothing else; the database is not in either. Liveness is separate so
          # the kubelet never restarts a healthy JVM over an outage a restart
          # cannot fix. Readiness drops while the service starts and drains. A
          # database outage leaves both UP: the pod stays in the Service and
          # answers each request with its own error, and /actuator/health (not a
          # probe) is what reports DOWN.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 30      # up to 150s for a cold JVM

          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 1536Mi }

          volumeMounts:
            - { name: tmp, mountPath: /tmp }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
