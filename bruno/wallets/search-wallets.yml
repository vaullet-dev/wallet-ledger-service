info:
  name: Search wallets
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/wallets?account_id={{account_id}}&limit=50"
  params:
    - name: account_id
      value: "{{account_id}}"
      type: query
    - name: type
      value: REAL
      type: query
      disabled: true
    - name: status
      value: ACTIVE
      type: query
      disabled: true
    - name: limit
      value: "50"
      type: query
    - name: cursor
      value: ""
      type: query
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Wallets matching every filter given, oldest first: here the account's two. `type` and `status` narrow
  it further. Pass `next_cursor` from the response as `cursor` for the next page; no `next_cursor` means
  the last page.
