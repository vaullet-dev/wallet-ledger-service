info:
  name: Get account balance
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/v1/accounts/{{account_id}}/balance"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  The account's totals and `currency`, and `wallets` with each wallet's totals; the buckets are on the
  wallet balance. `available` and `withdrawable` count `ACTIVE` wallets only.
