info:
  name: Get wallet
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/wallets/{{real_wallet_id}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Type, status and timestamps; `closed_at` appears once the wallet is closed. The money is on its balance.
