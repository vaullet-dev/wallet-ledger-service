# ---------------------------------------------------------------------------
# Base configuration — shared by every environment.
#
# Conventions this file follows:
#   * YAML, not .properties: nesting makes the shape of the configuration visible.
#   * Every environment-specific or secret value is an ${ENV_VAR} reference.
#     A default is provided only where the default is safe everywhere.
#   * Profile-specific overrides live in application-<profile>.yaml, never in
#     if/else inside the application.
#   * Anything the whole platform agrees on is imported, not restated. What is
#     left in this file is what the ledger actually decides.
# ---------------------------------------------------------------------------
spring:
  application:
    name: ledger-service

  config:
    # @vaullet-io/backend-common-web ships the platform defaults: virtual threads,
    # snake_case JSON (ADR-011 §8), problem+json for framework errors, graceful
    # shutdown, the Actuator exposure list, tracing sampling and the log correlation
    # pattern. Read them at
    # backend-common-web/src/main/resources/vaullet/platform-defaults.yaml.
    #
    # An imported document ranks BELOW the file importing it, so anything set here
    # still wins. Importing explicitly rather than letting an auto-configuration set
    # property defaults is deliberate: a reader of this file can follow one line to
    # everything that is configured, instead of concluding from silence that nothing is.
    import: "classpath:vaullet/platform-defaults.yaml"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      # ADR-004: "the transaction does no network I/O while holding the lock", and a
      # statement timeout bounds head-of-line blocking on a hot account. A reserve that
      # cannot take the account row lock within a second gives up, and the caller gets
      # 503 ACCOUNT_BUSY with a Retry-After rather than a thread parked indefinitely.
      connection-init-sql: SET statement_timeout = '1s'
      # Small pools beat large ones: the database, not the app, is the bottleneck, and a
      # pool bigger than the database's worker count just moves the queue. Doubly true
      # here, where throughput is bounded by per-account row locks rather than by
      # connections.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      # Hikari's own settings are plain milliseconds — they bind straight onto
      # HikariConfig and do not go through Spring's Duration converter, so `3s` here
      # fails at startup. Spring-owned properties elsewhere in this file do take
      # durations; the inconsistency is Hikari's, and it is worth a comment.
      connection-timeout: 3000
      # Logs a stack trace for a connection held longer than this — finds the
      # long-running transaction before it exhausts the pool in production.
      leak-detection-threshold: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuse to run against a database whose history does not match — a checksum
    # mismatch means someone edited an applied migration. On a ledger that is not a
    # style violation, it is a schema whose constraints nobody can vouch for.
    validate-on-migrate: true

  mvc:
    # Deliberately no `apiversion` block, and none in the platform defaults either. The
    # @vaullet-io template resolves the API version from an X-API-Version header;
    # ADR-011 chose the major version in the URI path instead (/v1/reservations) and
    # rejected header versioning outright, because a path is greppable in logs and
    # dashboards while a missing header is an implicit version nobody notices.

  security:
    oauth2:
      resourceserver:
        jwt:
          # No default on purpose. An unset issuer means no JwtDecoder, which means the
          # context refuses to start rather than starting without token validation.
          issuer-uri: ${OAUTH2_ISSUER_URI:}

server:
  error:
    # Inherited from the platform defaults, restated here because the reason is sharper
    # on this service than on any other: the messages would be SQL, and the statements
    # are the design (ADR-004).
    include-message: never
    include-stacktrace: never

management:
  observations:
    key-values:
      application: ledger-service

logging:
  level:
    root: INFO
    io.vaullet.ledger: ${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------
# Platform library settings (@vaullet-io/backend-common), bound and validated by
# ApiProperties, OpenApiProperties and SecurityProperties.
#
# The prefix is `vaullet` rather than `app` so that a reader can tell at a glance
# which keys come from the shared library and which are this codebase's own. The
# `app` block below is the ledger's whole share, and it is one label — ADR-004 puts
# hold policy in ledger_config.max_hold_seconds, in the database, read inside the
# same transaction that enforces it. Mirroring it here would give the ledger two
# sources of truth for one rule.
# ---------------------------------------------------------------------------
app:
  # Free-form environment label, interpolated into the OpenAPI description below.
  environment: ${APP_ENVIRONMENT:unknown}

vaullet:
  api:
    # Empty by default: this service's callers are other services (ADR-008), not
    # browsers, so CORS stays off unless a deployment explicitly opens it.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # ADR-011 §2 puts the major version in the path; the library default already
    # matches, and it is restated because CORS scope is worth being explicit about.
    cors-path-pattern: /v1/**
    allowed-methods: GET,POST,DELETE

  security:
    # What the @PreAuthorize rules in this service ask for. Under the `local` profile
    # these are handed to the anonymous principal, so a developer exercises the real
    # authorisation rules rather than a build with authorisation compiled out.
    local:
      anonymous-authorities: SCOPE_ledger:read,SCOPE_ledger:write,ROLE_OPERATOR

  openapi:
    title: Vaullet Ledger API
    # The major version in the path (ADR-011). Compatible additions do not change it;
    # a breaking change means /v2 and a 12-month deprecation window.
    version: "1"
    description: |
      Atomic balance reservations — see ADR-004.

      Money is a decimal string with an explicit currency, never a JSON number (ADR-011).
      Timestamps are RFC 3339 UTC. Errors are RFC 9457 problem+json carrying a stable `code`.

      Environment: ${app.environment}
